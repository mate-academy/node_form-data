<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Data</title>
</head>
<body>
<h1>Form Data</h1>
<form action="/add-expense" method="POST" enctype="application/x-www-form-urlencoded" name="formData">
<label for="title">
  <p>Title</p>
  <input id="title" name="title" type="text"/>
</label>
<label for="amount">
  <p>Amount</p>
  <input id="amount" name="amount" type="number"/>
</label>
<label for="data">
  <p>Data</p>
  <input id="data" name="date" type="date"/>
</label>
<br />
<button type="submit">
  Save
</button>
</form>
</body>
</html>
