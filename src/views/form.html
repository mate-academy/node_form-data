<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Add Expense</title>
  </head>
  <body>
    <h1>Add Expense</h1>
    <form action="/add-expense" method="POST">
      <label>
        Date:
        <input type="date" name="date" required />
      </label>
      <br />
      <label>
        Title:
        <input type="text" name="title" required />
      </label>
      <br />
      <label>
        Amount:
        <input type="number" name="amount" required />
      </label>
      <br />
      <button type="submit">Submit</button>
    </form>
  </body>
</html>
